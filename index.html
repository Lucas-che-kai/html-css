<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia dos meus sites</title>
    <!-- 引入 Nunito 字體 -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #4a6fa5;
            --secondary-color: #166088;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --card-bg: #ffffff;
            --text-main: #2b2d42;
            --text-muted: #6c757d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--secondary-color);
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 30px;
            font-weight: 400;
        }

        .project-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .project-item {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 20px;
            border-radius: 15px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .project-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .project-item h2 {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
            text-transform: capitalize;
        }

        .btn {
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn:hover {
            background-color: var(--secondary-color);
            transform: scale(1.05);
        }

        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Olá, bem-vindo ao meu guia de sites</h1>
        <p class="subtitle">Clique abaixo para acessar os sites desenvolvidos</p>

        <div class="project-list">
            <!-- 專案 1 -->
            <div class="project-item">
                <h2>Aprendizagem do HTML básico</h2>
                <a class="btn" href="exercicio-001/index.html">Acessar Projeto</a>
            </div>

            <!-- 專案 2 -->
            <div class="project-item">
                <h2>Aprendizagem do CSS básico</h2>
                <a class="btn" href="exercicio-002 css/index.html">Acessar Projeto</a>
            </div>

            <!-- 專案 3 -->
            <div class="project-item">
                <h2>Projeto 01 - Android</h2>
                <a class="btn" href="projeto01-android/android.html">Acessar Projeto</a>
            </div>
        </div>
    </div>

</body>
</html>
